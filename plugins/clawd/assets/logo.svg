<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title desc">
  <title id="title">Clawd</title>
  <desc id="desc">Official 1:1 Clawd plugin mark: geometric lobster claw on Solana neon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061117"/>
      <stop offset="0.55" stop-color="#0b1525"/>
      <stop offset="1" stop-color="#13091c"/>
    </linearGradient>
    <linearGradient id="claw" x1="0.12" y1="0.08" x2="0.92" y2="0.94">
      <stop offset="0" stop-color="#14F195"/>
      <stop offset="0.48" stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="shell" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7CFFD0"/>
      <stop offset="1" stop-color="#14F195"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="20" fill="none" stroke="#1b3750" stroke-width="1.25" opacity="0.7"/>
  <circle cx="64" cy="64" r="46" fill="none" stroke="#9945FF" stroke-width="1" opacity="0.28"/>

  <g filter="url(#glow)" fill="url(#claw)" stroke="none">
    <!-- left crusher claw -->
    <path d="M54 46c-16-18-34-12-38 2-3 11 4 22 16 26 7 2 12-1 14-6-8 1-14-4-13-12 1-8 12-12 21-10z"/>
    <path d="M42 36c-8-9-20-6-22 4-1 7 5 12 12 13 3-6 7-11 10-17z"/>
    <!-- right pincer -->
    <path d="M74 46c16-18 34-12 38 2 3 11-4 22-16 26-7 2-12-1-14-6 8 1 14-4 13-12-1-8-12-12-21-10z"/>
    <path d="M86 36c8-9 20-6 22 4 1 7-5 12-12 13-3-6-7-11-10-17z"/>
    <!-- carapace -->
    <ellipse cx="64" cy="68" rx="16" ry="22" fill="url(#shell)"/>
    <!-- head -->
    <ellipse cx="64" cy="46" rx="11" ry="10" fill="url(#shell)"/>
    <!-- tail fan -->
    <path d="M64 88c-4 6-12 12-20 14 6-2 10-8 12-14 2 8 6 14 8 16 2-2 6-8 8-16 2 6 6 12 12 14-8-2-16-8-20-14z"/>
    <!-- antennae -->
    <path d="M58 38c-6-12-14-18-22-20 10 4 16 12 20 20z" fill="#00D4FF"/>
    <path d="M70 38c6-12 14-18 22-20-10 4-16 12-20 20z" fill="#00D4FF"/>
  </g>

  <circle cx="60" cy="45" r="2.2" fill="#061117"/>
  <circle cx="68" cy="45" r="2.2" fill="#061117"/>
  <circle cx="60.6" cy="44.4" r="0.8" fill="#E8FFFB"/>
  <circle cx="68.6" cy="44.4" r="0.8" fill="#E8FFFB"/>
</svg>
