<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Clawd</title>
  <desc id="desc">Animated OpenClawd banner: neon lobster claw, Solana gradient, VS Code + Cursor + VSCodium.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041016"/>
      <stop offset="0.45" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#14081c"/>
    </linearGradient>
    <linearGradient id="claw" x1="0.1" y1="0.1" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#14F195">
        <animate attributeName="stop-color" values="#14F195;#00D4FF;#9945FF;#14F195" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#00D4FF">
        <animate attributeName="stop-color" values="#00D4FF;#9945FF;#14F195;#00D4FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#9945FF">
        <animate attributeName="stop-color" values="#9945FF;#14F195;#00D4FF;#9945FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14F195"/>
      <stop offset="0.5" stop-color="#E8FFFB"/>
      <stop offset="1" stop-color="#9945FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="420" rx="36"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <circle cx="180" cy="90" r="160" fill="#14F195" opacity="0.08" filter="url(#soft)">
      <animate attributeName="opacity" values="0.05;0.14;0.05" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="340" r="200" fill="#9945FF" opacity="0.12" filter="url(#soft)">
      <animate attributeName="opacity" values="0.08;0.18;0.08" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="-20" r="140" fill="#00D4FF" opacity="0.08" filter="url(#soft)"/>

    <g opacity="0.22" stroke="#1b3750" fill="none">
      <path d="M0 70h1200M0 140h1200M0 210h1200M0 280h1200M0 350h1200"/>
      <path d="M80 0v420M160 0v420M240 0v420M320 0v420M400 0v420M480 0v420M560 0v420M640 0v420M720 0v420M800 0v420M880 0v420M960 0v420M1040 0v420M1120 0v420"/>
    </g>

    <rect x="0" y="0" width="1200" height="18" fill="#00D4FF" opacity="0.07">
      <animateTransform attributeName="transform" type="translate" values="0 -40;0 440;0 -40" dur="4.8s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(70,78) scale(2.05)" filter="url(#glow)">
      <g>
        <g fill="url(#claw)">
          <path d="M54 46c-16-18-34-12-38 2-3 11 4 22 16 26 7 2 12-1 14-6-8 1-14-4-13-12 1-8 12-12 21-10z"/>
          <path d="M42 36c-8-9-20-6-22 4-1 7 5 12 12 13 3-6 7-11 10-17z"/>
          <path d="M74 46c16-18 34-12 38 2 3 11-4 22-16 26-7 2-12-1-14-6 8 1 14-4 13-12-1-8-12-12-21-10z"/>
          <path d="M86 36c8-9 20-6 22 4 1 7-5 12-12 13-3-6-7-11-10-17z"/>
          <ellipse cx="64" cy="68" rx="16" ry="22"/>
          <ellipse cx="64" cy="46" rx="11" ry="10"/>
          <path d="M64 88c-4 6-12 12-20 14 6-2 10-8 12-14 2 8 6 14 8 16 2-2 6-8 8-16 2 6 6 12 12 14-8-2-16-8-20-14z"/>
          <path d="M58 38c-6-12-14-18-22-20 10 4 16 12 20 20z" fill="#00D4FF"/>
          <path d="M70 38c6-12 14-18 22-20-10 4-16 12-20 20z" fill="#00D4FF"/>
        </g>
        <circle cx="60" cy="45" r="2.2" fill="#061117"/>
        <circle cx="68" cy="45" r="2.2" fill="#061117"/>
        <animateTransform attributeName="transform" type="rotate" values="-4 64 64;4 64 64;-4 64 64" dur="5s" repeatCount="indefinite"/>
      </g>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="430" y="148" fill="url(#word)" font-size="92" font-weight="800" letter-spacing="8">CLAWD</text>
      <text x="434" y="198" fill="#7CFFD0" font-size="22" letter-spacing="3.5">OPENCLAWD  /  v1.0.0</text>
      <text x="434" y="248" fill="#9ad7ff" font-size="20">VS Code  +  Cursor  +  VSCodium</text>
      <text x="434" y="286" fill="#cbb7ff" font-size="16">plugins  /  MCP  /  skills  /  OODA  /  Helius</text>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#E8FFFB">
      <g transform="translate(434,318)">
        <rect width="118" height="32" rx="16" fill="#0d2133" stroke="#14F195" stroke-width="1.2"/>
        <text x="59" y="21" text-anchor="middle">clawd</text>
      </g>
      <g transform="translate(564,318)">
        <rect width="140" height="32" rx="16" fill="#0d2133" stroke="#00D4FF" stroke-width="1.2"/>
        <text x="70" y="21" text-anchor="middle">clawd-code</text>
      </g>
      <g transform="translate(716,318)">
        <rect width="118" height="32" rx="16" fill="#0d2133" stroke="#9945FF" stroke-width="1.2"/>
        <text x="59" y="21" text-anchor="middle">helius</text>
      </g>
    </g>

    <circle cx="1080" cy="86" r="6" fill="#14F195">
      <animate attributeName="cy" values="86;70;86" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1124" cy="128" r="4" fill="#00D4FF">
      <animate attributeName="cy" values="128;108;128" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1048" cy="160" r="5" fill="#9945FF">
      <animate attributeName="cy" values="160;148;160" dur="2.7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
